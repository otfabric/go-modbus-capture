name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: go-modbus-capture
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
    secrets: inherit

  # The per-package coverage floor (TEST-012).
  coverage-packages:
    name: Per-package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check
